services:
  - type: web
    name: tds-databot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bot:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: AIPIPE_TOKEN
        sync: false
      - key: MODEL
        value: gpt-4o
      - key: GEMINI_API_KEY
        sync: false
      - key: BASE_URL
        sync: false
